name: build
on:
  pull_request:
  push:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Create a GitHub Release with this tag (e.g. v0.30.8-craftfix.1). Leave empty to only build."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout repository
        uses: actions/checkout@v4
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: setup jdk 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build
        run: ./gradlew build --stacktrace
      - name: list built jars
        run: ls -la build/libs/
      - name: capture build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Artifacts
          path: build/libs/
      - name: create release
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}
        run: |
          JAR=$(ls build/libs/*.jar | grep -v -- '-sources.jar' | head -n1)
          PRERELEASE=""
          case "$TAG" in *-alpha*|*-beta*|*-rc*) PRERELEASE="--prerelease";; esac
          gh release create "$TAG" "$JAR" --target "$GITHUB_SHA" --title "Item Scroller Crafting Fix $TAG (Minecraft 1.21.11)" --notes-file RELEASE_NOTES.md $PRERELEASE
